<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Global · Onboarding</title>
<script src="character.js"></script>
<style>
  /* === Palette (matches climb.html) ===================================== */
  :root {
    --cream:        #faf6ff;
    --cream-2:      #f0e6ff;
    --lavender:     #b890ff;
    --lavender-2:   #d4baff;
    --lavender-3:   #e8defa;
    --pink:         #ff60a0;
    --pink-2:       #ffb0d8;
    --violet:       #4a2a7a;
    --violet-2:     #6a4ec0;
    --violet-deep:  #2a1454;
    --teal:         #3aa890;
    --shadow:       rgba(60, 30, 120, 0.18);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: var(--cream); color: var(--violet-deep); font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif; line-height: 1.55; }
  a { color: var(--violet-2); }

  /* === Page chrome ====================================================== */
  .page { max-width: 720px; margin: 0 auto; padding: 32px 22px 80px; }
  @media (min-width: 900px) { .page { max-width: 960px; padding: 56px 32px 120px; } }

  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom: 28px; }
  .brand   { font-weight: 900; letter-spacing: 3px; font-size: 14px; color: var(--violet); }
  .brand span { color: var(--pink); }
  .kicker  { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.55; }

  /* === Editorial postcard hero ========================================== */
  .hello { margin-bottom: 18px; padding-top: 8px; }
  .hello-eyebrow {
    font-family: 'SF Mono', 'JetBrains Mono', Menlo, ui-monospace, monospace;
    font-size: 11px; letter-spacing: 3px;
    color: var(--violet-2); opacity: 0.75; text-transform: uppercase;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .hello-eyebrow .eyebrow-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--pink); box-shadow: 0 0 0 4px rgba(255,96,160,0.18);
  }
  .hello-h1 {
    font-size: clamp(40px, 8.4vw, 68px);
    line-height: 0.98;
    font-weight: 900;
    letter-spacing: -1.6px;
    color: var(--violet-deep);
    margin-bottom: 4px;
  }
  .hello-h1 .accent {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: var(--pink);
    font-weight: 900;
    letter-spacing: -0.5px;
  }
  .hello-rule { width: 56px; height: 3px; background: var(--pink); border-radius: 2px; margin: 18px 0 14px; }
  .hello-promise {
    font-size: clamp(16px, 2.4vw, 19px);
    font-weight: 700; color: var(--violet);
    letter-spacing: -0.15px;
    max-width: 48ch;
    margin-bottom: 4px;
  }
  .hello-ambient {
    font-size: 14px; opacity: 0.62; max-width: 48ch; line-height: 1.5;
  }

  /* === Climbing scene — open, no card enclosure ========================= */
  .scene {
    position: relative;
    width: 100%;
    aspect-ratio: 1.45 / 1;
    margin: 14px 0 8px;
    overflow: visible;
  }
  .scene-trail {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  /* Character renders ABOVE the rocks (z 4 vs rocks z 2) so the climber is
     fully visible — hands gripping the peak, body on the face, legs braced.
     During a leap z bumps to 6 so they fly past intermediate rocks. */
  .scene-rocks { position: absolute; inset: 0; z-index: 2; }
  .rock {
    position: absolute;
    width: clamp(62px, 12vw, 96px);
    transform: translate(-50%, -50%);
    cursor: pointer;
    background: none; border: none; padding: 0;
    transition: transform 0.18s cubic-bezier(.2,.9,.3,1.4);
    filter: drop-shadow(0 6px 10px rgba(60, 30, 120, 0.18));
  }
  .rock:hover { transform: translate(-50%, -52%) scale(1.05); }
  .rock svg { width: 100%; height: auto; display: block; }
  .rock .rock-label {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%);
    margin-top: 8px;
    font-size: 10px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--violet); white-space: nowrap;
    line-height: 1.25; text-align: center;
    pointer-events: none;
  }
  .rock .rock-sub {
    display: block; margin-top: 3px;
    font-size: 9.5px; opacity: 0.62; font-weight: 600;
    letter-spacing: 1.5px;
  }
  .rock.is-next .rock-label { color: var(--pink); }
  .rock.is-current::after {
    content: ''; position: absolute;
    bottom: -2px; left: 50%; transform: translateX(-50%);
    width: 70%; height: 10px;
    background: radial-gradient(ellipse, rgba(40,20,70,0.18), transparent 70%);
    pointer-events: none;
  }
  .rock-glow {
    position: absolute; inset: -10px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,96,160,0.42), transparent 70%);
    pointer-events: none; opacity: 0;
    z-index: -1;
  }
  .rock.is-next .rock-glow {
    opacity: 1; animation: rockGlow 2s ease-in-out infinite;
  }
  @keyframes rockGlow {
    0%, 100% { opacity: 0.5;  transform: scale(0.9); }
    50%      { opacity: 1;    transform: scale(1.12); }
  }
  .rock.is-done .face { opacity: 0.78; }

  .scene-character {
    position: absolute;
    width: clamp(56px, 10vw, 84px);
    /* Climbing pose: HANDS align with the rock peak (~7% from top of the
       character SVG → translate Y of -34%). Body sits on the rock face
       below; legs brace below the rock. */
    transform: translate(-50%, -34%);
    pointer-events: none; z-index: 4;
    filter: drop-shadow(0 5px 7px rgba(40, 20, 70, 0.32));
  }
  .scene-character svg { width: 100%; height: auto; display: block; }
  /* Subtle idle sway as if the climber is breathing against the rock. */
  .scene-character.gripping { animation: gripBreath 3.4s ease-in-out infinite; }
  @keyframes gripBreath {
    0%, 100% { transform: translate(-50%, -34%) rotate(-1.2deg); }
    50%      { transform: translate(-50%, -33%) rotate( 1.2deg); }
  }
  .scene-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin: 0 4px 24px;
    font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace;
    font-size: 10px; letter-spacing: 2.5px;
    color: var(--violet-2); opacity: 0.78; text-transform: uppercase;
  }
  .scene-meta strong { color: var(--violet-deep); font-weight: 800; letter-spacing: 1px; }

  /* === Stage screens (modal-style overlays) ============================= */
  .scrim { position: fixed; inset: 0; background: rgba(40, 20, 70, 0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; align-items: flex-start; justify-content: center; z-index: 50; padding: 24px 16px; overflow-y: auto; }
  .scrim.on { display: flex; }
  .sheet { background: var(--cream); border-radius: 22px; padding: 28px 24px 32px; max-width: 560px; width: 100%; box-shadow: 0 30px 80px rgba(40, 20, 70, 0.35); margin: 8px 0 32px; }
  @media (min-width: 720px) { .sheet { padding: 36px 36px 40px; } }
  .sheet .topline { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .sheet .step { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--lavender); font-weight: 800; }
  .sheet .close-x { background: none; border: none; color: var(--violet); font-size: 26px; cursor: pointer; line-height: 1; padding: 4px 8px; opacity: 0.5; }
  .sheet .close-x:hover { opacity: 1; }
  .sheet h2 { font-size: 28px; font-weight: 900; letter-spacing: -0.2px; margin-bottom: 4px; }
  .sheet .subtitle { font-size: 14px; opacity: 0.7; margin-bottom: 22px; }
  .sheet .panel { background: white; border: 1px solid var(--lavender-3); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .sheet .panel.tinted { background: var(--lavender-3); border-color: var(--lavender-2); }
  .sheet .panel h3 { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--violet-2); margin-bottom: 8px; font-weight: 800; }
  .sheet .panel p { font-size: 15px; opacity: 0.85; }
  .sheet .panel p + p { margin-top: 8px; }
  .sheet label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--violet); margin-bottom: 6px; margin-top: 14px; }
  .sheet input, .sheet textarea { width: 100%; background: white; border: 1.5px solid var(--lavender-3); border-radius: 10px; padding: 11px 13px; font-size: 16px; color: var(--violet-deep); font-family: inherit; }
  .sheet input:focus, .sheet textarea:focus { outline: none; border-color: var(--lavender); }
  .sheet textarea { min-height: 70px; resize: vertical; line-height: 1.45; }
  .sheet .hint { font-size: 12px; opacity: 0.55; margin-top: 4px; }
  .sheet .examples { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .sheet .examples button { background: var(--lavender-3); color: var(--violet); border: none; border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .sheet .examples button:hover { background: var(--lavender-2); }

  .cta { width: 100%; background: var(--lavender); color: var(--violet-deep); border: none; border-radius: 12px; padding: 14px 22px; font-size: 16px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; box-shadow: 0 6px 0 var(--violet-2), 0 10px 22px rgba(80, 40, 140, 0.28); margin-top: 18px; transition: transform 0.08s; font-family: inherit; }
  .cta:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--violet-2); }
  .cta.secondary { background: white; color: var(--violet); box-shadow: 0 4px 0 var(--lavender-3); font-size: 13px; padding: 11px 16px; }
  .cta.secondary:active { box-shadow: 0 2px 0 var(--lavender-3); }
  .cta.ghost { background: transparent; color: var(--violet); box-shadow: none; border: 2px solid var(--lavender); }
  .cta.tiny { font-size: 12px; padding: 7px 14px; margin-top: 0; box-shadow: 0 3px 0 var(--lavender-3); }
  .cta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .cta-row .cta { flex: 1 1 200px; margin-top: 0; }
  .cta-row .cta.secondary { flex: 1 1 140px; }

  /* Category picker grid */
  .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  @media (min-width: 480px) { .cat-grid { grid-template-columns: repeat(4, 1fr); } }
  .cat-grid button { background: white; border: 1.5px solid var(--lavender-3); border-radius: 12px; padding: 12px 8px; font-size: 13px; font-weight: 800; color: var(--violet); cursor: pointer; font-family: inherit; transition: transform 0.06s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cat-grid button .emoji { font-size: 22px; }
  .cat-grid button:hover { border-color: var(--lavender); }
  .cat-grid button.selected { background: var(--lavender); color: var(--violet-deep); border-color: var(--lavender); transform: scale(0.96); }

  /* Intro-line display */
  .intro-line { background: white; border: 1.5px solid var(--lavender); border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: 15.5px; line-height: 1.5; color: var(--violet-deep); min-height: 80px; }
  .intro-line.empty { color: var(--violet-2); opacity: 0.55; font-style: italic; }
  .intro-line[contenteditable="true"] { outline: 2px solid var(--lavender); }

  /* Madlib form */
  .madlib { background: white; border: 1px solid var(--lavender-3); border-radius: 14px; padding: 4px; margin-top: 12px; }
  .madlib-row { border-bottom: 1px dashed var(--lavender-3); padding: 12px 14px; }
  .madlib-row:last-child { border-bottom: none; }
  .madlib-row label { margin-top: 0; margin-bottom: 4px; font-size: 11px; }
  .madlib-row input { border: none; padding: 4px 0; font-size: 15px; background: transparent; border-bottom: 1.5px solid transparent; border-radius: 0; }
  .madlib-row input:focus { border-bottom-color: var(--lavender); }

  /* Result poster */
  .poster-wrap { display: flex; justify-content: center; margin: 16px 0 8px; }
  .poster-wrap canvas { max-width: 100%; height: auto; border-radius: 14px; box-shadow: 0 12px 32px var(--shadow); display: block; }

  /* Stage 4 link tile */
  .external-tile { background: linear-gradient(135deg, var(--lavender-2), var(--pink-2)); border-radius: 16px; padding: 22px; color: var(--violet-deep); text-decoration: none; display: block; }
  .external-tile h3 { font-size: 22px; margin-bottom: 6px; font-weight: 900; }
  .external-tile p { font-size: 14px; opacity: 0.85; }
  .external-tile .arrow { float: right; font-size: 24px; opacity: 0.6; }

  /* Footer */
  .footer { margin-top: 56px; font-size: 12px; opacity: 0.5; text-align: center; letter-spacing: 1px; }

  /* Tiny utility */
  .hidden { display: none !important; }

  /* === Warmth & motion ================================================== */
  /* Tiles: subtle lift + barely-rotation on hover. */
  .tile { transition: transform 0.22s cubic-bezier(.2,.9,.3,1.4), box-shadow 0.22s ease, border-color 0.2s; }
  .tile:hover { transform: translateY(-4px) rotate(-0.5deg); box-shadow: 0 14px 32px var(--shadow); border-color: var(--lavender); }
  .tile .badge.next { animation: nextGlow 2.2s ease-in-out infinite; }
  @keyframes nextGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 96, 160, 0.45); }
    50%      { box-shadow: 0 0 0 12px rgba(255, 96, 160, 0); }
  }

  /* Hero name flourish on first appearance. */
  .hello .accent { display: inline-block; }
  .hello .accent.fresh { animation: namePop 0.6s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes namePop {
    0%   { transform: scale(0.6) rotate(-6deg); opacity: 0; }
    60%  { transform: scale(1.12) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  /* Toast — admit-one ticket. Deep violet card with a pink moon-stamp in the
     top-right and a tiny mono kicker. Mirrors the share-poster ticket. */
  .toast {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%) translateY(-40px);
    background: var(--violet-deep); color: var(--cream);
    padding: 14px 26px 14px 20px;
    border-radius: 16px;
    box-shadow: 0 18px 40px rgba(40, 20, 70, 0.42), 0 2px 6px rgba(40,20,70,0.18);
    display: flex; align-items: center; gap: 14px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.45s cubic-bezier(.2,.9,.3,1.4);
    z-index: 200;
    max-width: 92vw; min-width: 260px;
    overflow: hidden;
  }
  .toast::before {
    content: ''; position: absolute;
    top: -22px; right: -22px;
    width: 64px; height: 64px;
    background: var(--pink);
    border-radius: 50%;
    opacity: 0.92;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .icon {
    font-size: 24px; line-height: 1; flex-shrink: 0;
    position: relative; z-index: 1;
  }
  .toast .body {
    display: flex; flex-direction: column; gap: 3px;
    position: relative; z-index: 1;
  }
  .toast .title {
    font-weight: 900; font-size: 14px;
    color: var(--cream); letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .toast .sub {
    font-size: 12.5px;
    color: rgba(248, 240, 255, 0.78);
    letter-spacing: 0.1px;
  }

  /* Footer with animated heart + wiggling team. */
  .footer { user-select: none; }
  .footer .heart {
    display: inline-block;
    transform-origin: center;
    animation: heartBeat 1.7s ease-in-out infinite;
  }
  @keyframes heartBeat {
    0%, 30%, 100% { transform: scale(1); }
    10%           { transform: scale(1.22); }
    18%           { transform: scale(0.94); }
    24%           { transform: scale(1.12); }
  }
  .footer .team {
    display: inline-block;
    font-weight: 800;
    color: var(--violet);
    transition: color 0.2s;
  }
  .footer:hover .team {
    color: var(--pink);
    animation: teamWiggle 0.45s ease-in-out;
  }
  @keyframes teamWiggle {
    0%, 100% { transform: rotate(0); }
    25%      { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg); }
    75%      { transform: rotate(-1.5deg); }
  }
  .footer .smiley {
    display: inline-block;
    transition: transform 0.2s;
  }
  .footer:hover .smiley { transform: rotate(20deg); }

  /* Primary CTA gets a gentle attention pulse only when it's the next step. */
  .cta.pulse { animation: ctaPulse 2.4s ease-in-out infinite; }
  @keyframes ctaPulse {
    0%, 100% { box-shadow: 0 6px 0 var(--violet-2), 0 10px 22px rgba(80,40,140,0.28); }
    50%      { box-shadow: 0 6px 0 var(--violet-2), 0 14px 30px rgba(255,96,160,0.42); }
  }

  /* Sheet entry: a small whoosh-in. */
  .scrim.on .sheet { animation: sheetIn 0.35s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes sheetIn {
    0%   { opacity: 0; transform: translateY(20px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Category tile delight. */
  .cat-grid button { transition: transform 0.12s, border-color 0.15s, background 0.15s; }
  .cat-grid button:hover { transform: translateY(-2px); }

  /* === Hero typography hierarchy ======================================= */
  .hello .promise {
    font-size: clamp(18px, 2.8vw, 22px);
    font-weight: 800;
    letter-spacing: -0.2px;
    color: var(--violet);
    margin-top: 4px;
    margin-bottom: 8px;
    line-height: 1.25;
  }
  .hello .promise::before {
    content: '→ ';
    color: var(--pink);
    font-weight: 900;
  }
  .hello .ambient {
    font-size: 15px;
    opacity: 0.68;
    max-width: 52ch;
    line-height: 1.5;
  }

  /* "Climb again" tiny link shown next to the advance CTA. */
  .climb-again {
    display: block; text-align: center;
    margin-top: 8px;
    font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--violet-2); font-weight: 700;
    background: none; border: none; cursor: pointer;
    padding: 4px 8px; font-family: inherit;
    transition: color 0.15s;
  }
  .climb-again:hover { color: var(--pink); }

  /* === Stage mantra box (the "Say: X" takeaway) ========================= */
  .mantra {
    background: linear-gradient(135deg, var(--lavender-3), #fff);
    border-left: 4px solid var(--pink);
    padding: 14px 18px;
    margin-top: 14px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 15px;
    color: var(--violet-deep);
    letter-spacing: 0.1px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    box-shadow: 0 4px 14px rgba(80,40,140,0.10);
  }
  .mantra .glyph {
    color: var(--pink);
    font-size: 18px;
    font-weight: 900;
    flex-shrink: 0;
  }
  .mantra .text { flex: 1; }

  /* === Stage fall card (failure is content) ============================ */
  .fall-card {
    background: white;
    border: 1.5px dashed var(--lavender-2);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .fall-card h3 {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--pink);
    font-weight: 900;
    margin-bottom: 6px;
  }
  .fall-card p { font-size: 14px; opacity: 0.85; }

  /* Respect reduced-motion users. */
  @media (prefers-reduced-motion: reduce) {
    .tile, .tile:hover { transition: none; }
    .tile .badge.next, .footer .heart, .hello .accent.fresh,
    .scrim.on .sheet, .cta.pulse, .toast { animation: none !important; }
    .toast { transition: opacity 0.2s; }
  }
</style>
</head>
<body>

<main class="page" id="app">

  <div class="topbar">
    <div class="brand">AI <span>GLOBAL</span></div>
    <div class="kicker">Onboarding</div>
  </div>

  <section class="hello">
    <p class="hello-eyebrow"><span class="eyebrow-dot"></span> AIGLO · 01 · 26 — POSTCARD</p>
    <h1 class="hello-h1" id="welcomeH1">Welcome<span id="welcomeComma"></span> <span id="welcomeName" class="accent">in</span>.</h1>
    <div class="hello-rule"></div>
    <p class="hello-promise" id="welcomePromise">Climb in. Meet your people. Catch this quarter.</p>
    <p class="hello-ambient" id="welcomeBlurb">AI Global is global, curious, and busy in the middle of a quarter — let's get you in the door.</p>
  </section>

  <section class="scene" id="climbScene" aria-label="Stage map">
    <svg class="scene-trail" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="M 12,82 Q 22,72 32,66 T 50,52 T 68,36 T 86,20"
            stroke="rgba(120,80,200,0.38)" stroke-width="0.55"
            fill="none" stroke-dasharray="1.8,1.6" stroke-linecap="round"/>
    </svg>
    <div class="scene-rocks" id="sceneRocks"></div>
    <div class="scene-character" id="sceneCharacter" aria-hidden="true"></div>
  </section>

  <div class="scene-meta">
    <span>QUARTER · <strong>Q1·2026</strong></span>
    <span>DOMAIN · <strong>MARKETING</strong></span>
  </div>

  <p class="footer" id="footer">Made with <span class="heart">❤️</span> by the <span class="team">AIGLO team</span> <span class="smiley">:)</span></p>
</main>

<div class="toast" id="toast"></div>
<div class="scrim" id="scrim">
  <div class="sheet" id="sheet"></div>
</div>

<script>
// =====================================================================
// State + content loader
// =====================================================================
const STATE_KEY = 'aiglo.state';
const NAME_KEY  = 'aiglo.name';
const RUN_KEY   = 'aiglo.lastRun';

let CONTENT = null, INTROS = null, MADLIB = null;

const state = {
  name: '',
  attempted: { 1: false, 2: false, 3: false, 4: false, 5: false },
  stage2: { category: null, intro: '', custom: '', loved: '' },
  stage3: { fields: {}, loved: '' },
  lastRun: null,
};

function loadState() {
  try { const r = localStorage.getItem(STATE_KEY); if (r) Object.assign(state, JSON.parse(r)); } catch (e) {}
  try { const n = localStorage.getItem(NAME_KEY);  if (n) state.name = n; } catch (e) {}
  try { const r = localStorage.getItem(RUN_KEY);   if (r) state.lastRun = JSON.parse(r); } catch (e) {}
}
function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify({
    name: state.name, attempted: state.attempted, stage2: state.stage2, stage3: state.stage3,
  })); } catch (e) {}
  if (state.name) { try { localStorage.setItem(NAME_KEY, state.name); } catch (e) {} }
}

async function loadContent() {
  const [s, i, m] = await Promise.all([
    fetch('content/stage-text.json').then(r => r.json()),
    fetch('content/intros.json').then(r => r.json()),
    fetch('content/madlib-examples.json').then(r => r.json()),
  ]);
  CONTENT = s; INTROS = i; MADLIB = m;
}

// =====================================================================
// Tile renderer
// =====================================================================
function renderHello(opts) {
  const nameEl = document.getElementById('welcomeName');
  const commaEl = document.getElementById('welcomeComma');
  const promiseEl = document.getElementById('welcomePromise');
  const blurbEl = document.getElementById('welcomeBlurb');
  if (state.name) { nameEl.textContent = state.name; commaEl.textContent = ','; }
  else            { nameEl.textContent = 'in';      commaEl.textContent = ''; }
  if (CONTENT && CONTENT.menu) {
    if (promiseEl && CONTENT.menu.heroSub)     promiseEl.textContent = CONTENT.menu.heroSub;
    if (blurbEl   && CONTENT.menu.heroSubLong) blurbEl.textContent   = CONTENT.menu.heroSubLong;
  }
  if (opts && opts.fresh) {
    nameEl.classList.remove('fresh');
    void nameEl.offsetWidth;   // restart animation
    nameEl.classList.add('fresh');
  }
}

// Wraps a stage's primary CTA. If the stage has been attempted AND there's
// a next stage, the primary CTA flips to "Next → <Stage N+1>" so the player
// is pushed forward instead of repeating. A tiny "climb again" link sits
// beneath. If not attempted, behaves like a normal CTA.
function makeStageCta(opts) {
  // opts: { stageId, nextStage, climbLabel, climbHint, nextLabel, onClimb }
  const wrap = document.createElement('div');
  const attempted = !!state.attempted[opts.stageId];
  const hasNext = opts.nextStage != null && opts.nextStage <= 5;
  if (attempted && hasNext && opts.nextLabel) {
    const advance = document.createElement('button');
    advance.className = 'cta pulse';
    advance.textContent = opts.nextLabel;
    advance.addEventListener('click', () => {
      closeStage();
      setTimeout(() => openStage(opts.nextStage), 280);
    });
    wrap.appendChild(advance);
    const again = document.createElement('button');
    again.type = 'button';
    again.className = 'climb-again';
    again.textContent = '↻ Climb again';
    again.addEventListener('click', () => opts.onClimb && opts.onClimb());
    wrap.appendChild(again);
  } else {
    const cta = document.createElement('button');
    cta.className = 'cta pulse';
    cta.textContent = opts.climbLabel;
    cta.addEventListener('click', () => opts.onClimb && opts.onClimb());
    wrap.appendChild(cta);
    if (opts.climbHint) {
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.style.textAlign = 'center';
      hint.style.marginTop = '8px';
      hint.textContent = opts.climbHint;
      wrap.appendChild(hint);
    }
  }
  return wrap;
}

// Mantra box: tiny "Say: X" takeaway that ends every stage modal.
// Inspired by Aiglo's Neural Nets game where each lesson card ends with
// a one-line mantra (e.g. "Say: numbers in → guess out.").
function makeMantra(text) {
  if (!text) return null;
  const d = document.createElement('div');
  d.className = 'mantra';
  d.innerHTML = `<span class="glyph">→</span><span class="text">${escapeText(text)}</span>`;
  return d;
}

// Fall card: when the climber misses the stage's target, show a tiny
// concept card instead of just a tossed-off failure line. "The lesson
// stays" — falling is part of the run.
function makeFallCard(fallObj) {
  if (!fallObj) return null;
  const d = document.createElement('div');
  d.className = 'fall-card';
  d.innerHTML = `<h3>${escapeText(fallObj.title)}</h3><p>${escapeText(fallObj.body)}</p>`;
  return d;
}

// Toast accepts a {icon, title, sub} object so it can show "what just
// happened" AND "what's ready now" — instead of a single cryptic line.
// String input is treated as the title for backwards compat.
function showToast(payload) {
  if (!payload) return;
  const t = document.getElementById('toast');
  const obj = typeof payload === 'string' ? { title: payload } : payload;
  t.innerHTML = `
    ${obj.icon ? `<span class="icon">${escapeText(obj.icon)}</span>` : ''}
    <div class="body">
      ${obj.title ? `<div class="title">${escapeText(obj.title)}</div>` : ''}
      ${obj.sub   ? `<div class="sub">${escapeText(obj.sub)}</div>`     : ''}
    </div>`;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 5200);
}

// Climbing scene: 5 rocks rising left-to-right, character on the next rock.
const ROCK_POSITIONS = {
  1: { left: 12, top: 82 },
  2: { left: 32, top: 66 },
  3: { left: 50, top: 52 },
  4: { left: 68, top: 36 },
  5: { left: 86, top: 22 },
};
const STAGE_BADGES = {
  1: { kicker: 'STAGE 1', sub: '100 m' },
  2: { kicker: 'STAGE 2', sub: '150 m' },
  3: { kicker: 'STAGE 3', sub: 'ENDLESS' },
  4: { kicker: 'STAGE 4', sub: 'NEURAL NETS' },
  5: { kicker: 'STAGE 5', sub: 'WHAT’S NEXT' },
};

function rockSvg() {
  return `<svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path class="face" d="M 8 54 L 28 18 L 50 8 L 72 16 L 92 52 Z"
          fill="#d6c2f5" stroke="#7e64bb" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 50 8  L 50 54" stroke="#9b85cf" stroke-width="1.1" opacity="0.45"/>
    <path d="M 28 18 L 46 54" stroke="#9b85cf" stroke-width="1.1" opacity="0.45"/>
    <path d="M 72 16 L 58 54" stroke="#9b85cf" stroke-width="1.1" opacity="0.45"/>
  </svg>`;
}

function characterNextRock() {
  for (let i = 1; i <= 5; i++) if (!state.attempted[i]) return i;
  return 5;
}

function currentOutfit() {
  let id = 'climber';
  try { id = localStorage.getItem('ascent_outfit') || 'climber'; } catch (e) {}
  return (typeof OUTFITS !== 'undefined' && OUTFITS.find(o => o.id === id)) || (typeof OUTFITS !== 'undefined' && OUTFITS[0]) || null;
}

function markCurrentRock(idx) {
  document.querySelectorAll('.rock').forEach(r => r.classList.remove('is-current'));
  const cur = document.querySelector(`.rock[data-idx="${idx}"]`);
  if (cur) cur.classList.add('is-current');
}

function renderScene() {
  const rocks = document.getElementById('sceneRocks');
  if (!rocks) return;
  rocks.innerHTML = '';
  const nextIdx = characterNextRock();
  for (let i = 1; i <= 5; i++) {
    const p = ROCK_POSITIONS[i];
    const b = STAGE_BADGES[i];
    const isDone = !!state.attempted[i];
    const isNext = i === nextIdx;
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'rock' + (isDone ? ' is-done' : '') + (isNext ? ' is-next' : '');
    el.dataset.idx = i;
    el.style.left = p.left + '%';
    el.style.top  = p.top  + '%';
    el.setAttribute('aria-label', `${b.kicker} — ${b.sub}`);
    el.innerHTML = `
      <span class="rock-glow"></span>
      ${rockSvg()}
      <span class="rock-label">${b.kicker}<span class="rock-sub">${b.sub}</span></span>
    `;
    el.addEventListener('click', () => {
      leapTo(i, () => openStage(i));
    });
    rocks.appendChild(el);
  }
}

function ensureCharacter() {
  const c = document.getElementById('sceneCharacter');
  if (!c) return null;
  const o = currentOutfit();
  // Prefer the hanging-climber pose (visible hands gripping); fall back to the
  // standing pose only if buildClimberSvg isn't loaded.
  const draw = (typeof buildClimberSvg === 'function') ? buildClimberSvg : buildCharSvg;
  if (o && typeof draw === 'function' && c.dataset.outfit !== o.id) {
    c.innerHTML = draw(o);
    c.dataset.outfit = o.id;
  }
  return c;
}

function snapCharacterTo(idx) {
  const c = ensureCharacter();
  if (!c) return;
  const p = ROCK_POSITIONS[idx];
  // Cancel any in-flight leap so inline transform doesn't override.
  if (c._anim) { try { c._anim.cancel(); } catch (e) {} c._anim = null; }
  c.style.transform = '';
  c.classList.remove('gripping');
  void c.offsetWidth;
  c.style.left = p.left + '%';
  c.style.top  = p.top  + '%';
  c.dataset.atRock = String(idx);
  c.classList.add('gripping');
  markCurrentRock(idx);
}

function placeCharacter() { snapCharacterTo(characterNextRock()); }

// Climber leap: windup → arc apex → reach → grip. Uses Web Animations API
// with intermediate keyframes so the path is a real arc, not a straight tween.
function leapTo(targetIdx, onArrive) {
  const c = ensureCharacter();
  if (!c) { onArrive && onArrive(); return; }
  const fromIdx = parseInt(c.dataset.atRock || String(characterNextRock()), 10);
  if (fromIdx === targetIdx) { onArrive && onArrive(); return; }

  if (c._anim) { try { c._anim.cancel(); } catch (e) {} c._anim = null; }
  c.classList.remove('gripping');

  const from = ROCK_POSITIONS[fromIdx];
  const to   = ROCK_POSITIONS[targetIdx];
  const dir  = targetIdx > fromIdx ? 1 : -1;
  // Arc height scales with how far we're jumping. We clamp the apex's
  // anchor-top so the climber stays in the scene area — the constant
  // translate(-50%,-88%) on the character already lifts it ~95px above the
  // anchor for the grip pose, so a too-small mid.top would fling him off
  // the top of the section.
  const dx = Math.abs(to.left - from.left);
  const arcH = Math.min(14, 4 + dx * 0.11);
  const mid  = { left: (from.left + to.left) / 2,
                 top:  Math.max(20, Math.min(from.top, to.top) - arcH) };
  const reach = { left: to.left - dir * 4,
                  top:  to.top  - 4 };
  const base = (rot, s) => `translate(-50%, -34%) rotate(${rot}deg) scale(${s})`;

  // Set z above rocks for the flight.
  c.style.left = from.left + '%';
  c.style.top  = from.top  + '%';
  c.style.zIndex = '6';

  const anim = c.animate([
    // 0% — gripping the start rock
    { left: from.left + '%', top: from.top + '%',
      transform: base(-2 * dir, 1),
      offset: 0, easing: 'cubic-bezier(.4,.0,.6,1)' },
    // 14% — wind-up: lean back, compress (the swing wind)
    { left: from.left + '%', top: (from.top + 2) + '%',
      transform: base(-22 * dir, 0.93),
      offset: 0.14, easing: 'cubic-bezier(.7,.0,.7,1)' },
    // 30% — explosive push off the start rock
    { left: (from.left + dir * 5) + '%', top: (from.top - 4) + '%',
      transform: base(14 * dir, 1.05),
      offset: 0.30, easing: 'cubic-bezier(.3,.6,.5,1)' },
    // 55% — airborne apex, arms extended into the swing
    { left: mid.left + '%', top: mid.top + '%',
      transform: base(34 * dir, 1.06),
      offset: 0.55, easing: 'cubic-bezier(.4,.0,.6,1)' },
    // 78% — reach forward to the next hold (hands lead)
    { left: reach.left + '%', top: reach.top + '%',
      transform: base(40 * dir, 1.02),
      offset: 0.78, easing: 'cubic-bezier(.4,.0,.3,1)' },
    // 92% — catch hold, body absorbs impact (slight overshoot down)
    { left: (to.left + dir * 1) + '%', top: (to.top + 2) + '%',
      transform: base(8 * dir, 0.96),
      offset: 0.92, easing: 'cubic-bezier(.2,.7,.4,1)' },
    // 100% — settle into grip
    { left: to.left + '%', top: to.top + '%',
      transform: base(0, 1),
      offset: 1 }
  ], { duration: 1150, fill: 'forwards' });

  c._anim = anim;
  const settle = () => {
    try { anim.commitStyles(); anim.cancel(); } catch (e) {}
    c._anim = null;
    c.style.zIndex = '';
    c.style.transform = '';   // hand control back to .gripping animation
    c.style.left = to.left + '%';
    c.style.top  = to.top  + '%';
    c.dataset.atRock = String(targetIdx);
    c.classList.add('gripping');
    markCurrentRock(targetIdx);
    if (onArrive) onArrive();
  };
  anim.onfinish = settle;
  anim.oncancel = () => { c.style.zIndex = ''; };
}

// =====================================================================
// Stage routing
// =====================================================================
function openStage(n) {
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = '';
  sheet.appendChild(makeStageHeader(n));
  if (n === 1) renderStage1(sheet);
  if (n === 2) renderStage2(sheet);
  if (n === 3) renderStage3(sheet);
  if (n === 4) renderStage4(sheet);
  if (n === 5) renderStage5(sheet);
  document.getElementById('scrim').classList.add('on');
  sheet.scrollTop = 0;
  document.querySelector('.scrim').scrollTop = 0;
}
function closeStage() { document.getElementById('scrim').classList.remove('on'); }
function makeStageHeader(n) {
  const t = CONTENT['stage' + n];
  const d = document.createElement('div');
  d.innerHTML = `
    <div class="topline">
      <span class="step">Stage ${n}</span>
      <button class="close-x" type="button" aria-label="Close">×</button>
    </div>
    <h2>${t.title}</h2>
    <p class="subtitle">${t.subtitle}</p>
  `;
  d.querySelector('.close-x').addEventListener('click', closeStage);
  return d;
}

// =====================================================================
// Stage 1 — Welcome + minimal pre-info + 100m climb + richer post-info
// =====================================================================
function renderStage1(sheet) {
  const t = CONTENT.stage1;

  // Name capture
  const name = document.createElement('div');
  name.className = 'panel';
  name.innerHTML = `
    <h3>${t.nameLabel}</h3>
    <input id="nameInput" type="text" placeholder="${t.namePlaceholder}" value="${escapeAttr(state.name)}" maxlength="40" autocomplete="given-name">
    <p class="hint">${t.namePersist}</p>
  `;
  sheet.appendChild(name);
  const input = name.querySelector('#nameInput');
  let priorName = state.name;
  input.addEventListener('input', () => {
    const wasEmpty = !priorName;
    state.name = input.value.trim();
    saveState();
    renderHello({ fresh: wasEmpty && !!state.name });
    if (state.name) priorName = state.name;
  });

  // Fall card — shown if the climber attempted Stage 1 and didn't reach
  // 100 m. "The lesson stays." (Pattern from Aiglo's Neural Nets game.)
  if (state.lastRun && state.lastRun.mode === 'guided' && state.lastRun.won === false && t.fall) {
    const fc = makeFallCard(t.fall);
    if (fc) sheet.appendChild(fc);
  }

  // Single AI Global explainer panel.
  const pre = document.createElement('div');
  pre.className = 'panel';
  pre.innerHTML = `<h3>${t.pre.title}</h3><p>${t.pre.body}</p>`;
  sheet.appendChild(pre);

  // Mantra — tiny "Say: X" takeaway line, the lesson compressed.
  const m = makeMantra(t.mantra);
  if (m) sheet.appendChild(m);

  sheet.appendChild(makeStageCta({
    stageId: 1, nextStage: 2,
    climbLabel: t.ctaLabel, climbHint: t.ctaHint, nextLabel: t.nextLabel,
    onClimb: () => {
      if (!state.name) { input.focus(); return; }
      saveState();
      launchClimb({ guided: true, target: 100 });
    },
  }));
}

// =====================================================================
// Stage 2 — Discord brief + intro picker + 150m + poster
// =====================================================================
function renderStage2(sheet) {
  const t = CONTENT.stage2;

  // Pre-climb context
  const pre = document.createElement('div');
  pre.className = 'panel';
  pre.innerHTML = `<h3>${t.pre.title}</h3><p>${t.pre.body}</p>`;
  sheet.appendChild(pre);

  // Category picker
  const picker = document.createElement('div');
  picker.className = 'panel';
  picker.innerHTML = `<h3>${t.categoryPrompt}</h3><div class="cat-grid" id="catGrid"></div>`;
  sheet.appendChild(picker);
  const grid = picker.querySelector('#catGrid');
  for (const c of CONTENT.categories) {
    const b = document.createElement('button');
    b.innerHTML = `<span class="emoji">${c.emoji}</span><span>${c.label}</span>`;
    b.dataset.cat = c.id;
    if (state.stage2.category === c.id) b.classList.add('selected');
    b.addEventListener('click', () => {
      grid.querySelectorAll('button').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      state.stage2.category = c.id;
      state.stage2.intro = pickIntro(state.name, c.id, 0);
      state.stage2.custom = '';
      shuffleCount = 0;
      lineBox.contentEditable = 'false';
      lineBox.textContent = renderIntroLine(state.stage2.intro);
      lineBox.classList.remove('empty');
      saveState();
    });
    grid.appendChild(b);
  }

  // Intro line
  const lineBox = document.createElement('div');
  const currentLine = state.stage2.custom || (state.stage2.intro ? renderIntroLine(state.stage2.intro) : '');
  lineBox.className = 'intro-line ' + (currentLine ? '' : 'empty');
  lineBox.textContent = currentLine || 'Pick a lane above to see a draft.';
  sheet.appendChild(lineBox);

  let shuffleCount = 0;
  const btnRow = document.createElement('div');
  btnRow.className = 'cta-row';
  btnRow.innerHTML = `
    <button class="cta secondary" id="shuffleBtn">${t.shuffleLabel}</button>
    <button class="cta secondary" id="ownBtn">${t.ownLabel}</button>
  `;
  sheet.appendChild(btnRow);
  btnRow.querySelector('#shuffleBtn').addEventListener('click', () => {
    if (!state.stage2.category) return;
    shuffleCount++;
    state.stage2.intro = pickIntro(state.name, state.stage2.category, shuffleCount);
    state.stage2.custom = '';
    lineBox.contentEditable = 'false';
    lineBox.textContent = renderIntroLine(state.stage2.intro);
    lineBox.classList.remove('empty');
    saveState();
  });
  btnRow.querySelector('#ownBtn').addEventListener('click', () => {
    state.stage2.intro = '';
    state.stage2.custom = state.stage2.custom || t.ownPlaceholder.replace('{name}', state.name || '');
    lineBox.contentEditable = 'true';
    lineBox.textContent = state.stage2.custom;
    lineBox.classList.remove('empty');
    lineBox.focus();
  });
  lineBox.addEventListener('input', () => {
    if (lineBox.contentEditable === 'true') { state.stage2.custom = lineBox.textContent; saveState(); }
  });

  // Outcome — only after a 150m run
  if (state.lastRun && state.lastRun.mode === 'target' && state.lastRun.target === 150 && !state.lastRun._consumedAt2) {
    const finalLine = state.stage2.custom || renderIntroLine(state.stage2.intro) || '';
    sheet.appendChild(makeOutcomePanel({
      tinted: true,
      won: state.lastRun.won,
      titleWin: t.outcome.winTitle,
      bodyWin:  t.outcome.winBody,
      titleFail: t.outcome.failTitle.replace('{meters}', state.lastRun.meters),
      bodyFail:  t.outcome.failBody,
      nextLine: t.outcome.next,
    }));
    sheet.appendChild(makePosterPanel({
      panelId: 'poster2',
      name: state.name,
      meters: state.lastRun.meters,
      won: state.lastRun.won,
      mainText: finalLine,
      lovedText: state.stage2.loved,
      copyLabel: 'Copy intro',
      copyText: finalLine,
      discordLabel: 'Open #introduce-yourself',
      discordUrl: CONTENT.brand.deepLinks.introduceYourself,
      shareLine: t.shareLine,
      disclosure: CONTENT.menu && CONTENT.menu.disclosure,
    }));
  }

  const m = makeMantra(t.mantra);
  if (m) sheet.appendChild(m);
  sheet.appendChild(makeStageCta({
    stageId: 2, nextStage: 3,
    climbLabel: t.ctaLabel, climbHint: t.ctaHint, nextLabel: t.nextLabel,
    onClimb: () => {
      if (!state.stage2.category && !state.stage2.custom) {
        lineBox.classList.add('empty');
        lineBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      launchClimb({ target: 150 });
    },
  }));
}

// =====================================================================
// Stage 3 — Buddy madlib + fuller info + endless climb + poster
// =====================================================================
function renderStage3(sheet) {
  const t = CONTENT.stage3;

  // How buddies work — single panel. AI Global background was delivered
  // in Stage 1; we don't restate it here.
  const pre = document.createElement('div');
  pre.className = 'panel';
  pre.innerHTML = `<h3>${t.pre.title}</h3><p>${t.pre.body}</p>`;
  sheet.appendChild(pre);

  // Madlib form
  state.stage3.fields = state.stage3.fields || {};
  const form = document.createElement('div');
  form.className = 'madlib';
  for (const f of MADLIB.fields) {
    const row = document.createElement('div');
    row.className = 'madlib-row';
    const init = state.stage3.fields[f.key] || (f.key === 'displayName' ? state.name : '');
    row.innerHTML = `
      <label>${f.emoji} ${f.label}</label>
      <input data-key="${f.key}" placeholder="${escapeAttr(f.placeholder)}" value="${escapeAttr(init)}">
      <div class="examples">
        ${f.examples.map(ex => `<button type="button" data-ex="${escapeAttr(ex)}">${escapeText(ex)}</button>`).join('')}
      </div>
    `;
    form.appendChild(row);
    const inp = row.querySelector('input');
    inp.addEventListener('input', () => { state.stage3.fields[f.key] = inp.value; saveState(); });
    row.querySelectorAll('.examples button').forEach(b => {
      b.addEventListener('click', () => {
        inp.value = b.dataset.ex; state.stage3.fields[f.key] = inp.value; saveState();
      });
    });
  }
  sheet.appendChild(form);

  // Outcome (after endless run)
  if (state.lastRun && state.lastRun.mode === 'endless' && !state.lastRun._consumedAt3) {
    const buddyMsg = composeBuddyMessage();
    sheet.appendChild(makeOutcomePanel({
      tinted: true,
      won: false,
      titleFail: t.outcome.posterTitle.replace('{meters}', state.lastRun.meters),
      bodyFail:  t.outcome.posterBody,
      nextLine:  t.outcome.next,
    }));
    sheet.appendChild(makeLovedField({
      stageKey: 'stage3',
      prompt: t.outcome.lovedPrompt,
      placeholder: t.outcome.lovedPlaceholder,
      initial: state.stage3.loved || '',
      onChange: v => { state.stage3.loved = v; saveState(); refreshPosters(); },
    }));
    sheet.appendChild(makePosterPanel({
      panelId: 'poster3',
      name: state.name,
      meters: state.lastRun.meters,
      won: false,
      mainText: buddyMsg,
      lovedText: state.stage3.loved,
      copyLabel: 'Copy for #find-a-buddy',
      copyText:  buddyMsg,
      copyLabel2: 'Copy intro line',
      copyText2: state.stage2.custom || renderIntroLine(state.stage2.intro) || `Hi everyone, I'm ${state.name || 'there'}.`,
      discordLabel: 'Open #find-a-buddy',
      discordUrl: CONTENT.brand.deepLinks.findABuddy,
      discordLabel2: 'Open #introduce-yourself',
      discordUrl2: CONTENT.brand.deepLinks.introduceYourself,
      shareLine: t.shareLine,
      disclosure: CONTENT.menu && CONTENT.menu.disclosure,
    }));
  }

  const m = makeMantra(t.mantra);
  if (m) sheet.appendChild(m);
  sheet.appendChild(makeStageCta({
    stageId: 3, nextStage: 4,
    climbLabel: t.ctaLabel, climbHint: t.ctaHint, nextLabel: t.nextLabel,
    onClimb: () => launchClimb({ endless: true }),
  }));
}

function composeBuddyMessage() {
  const m = MADLIB;
  let out = m.header + '\n';
  for (const f of m.fields) {
    const v = (state.stage3.fields[f.key] || '').trim();
    if (!v) continue;
    out += `${f.emoji} ${f.label}: ${v}\n`;
  }
  return out.trim();
}

  link.addEventListener('click', () => { state.attempted[4] = true; saveState(); renderScene(); placeCharacter(); });

}

// =====================================================================
// Intro picker
// =====================================================================
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function dayOfYear() {
  const d = new Date(); const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}
function pickIntro(name, category, shuffleSeed) {
  const pool = (INTROS[category] || []); if (!pool.length) return '';
  const idx = hashStr(`${name}|${category}|${dayOfYear()}|${shuffleSeed}`) % pool.length;
  return pool[idx];
}
function renderIntroLine(line) { return line ? line.replace(/<NAME>/g, state.name || 'there') : ''; }

// =====================================================================
// Climb game hand-off
// =====================================================================
function launchClimb(opts) {
  const p = new URLSearchParams();
  if (opts.guided)  p.set('guided', '1');
  if (opts.target)  p.set('target', String(opts.target));
  if (opts.endless) p.set('endless', '1');
  if (opts.seed)    p.set('seed', String(opts.seed));
  const here = location.pathname.replace(/index\.html$/, '');
  p.set('return', here || './');
  location.href = 'climb.html?' + p.toString();
}

// =====================================================================
// Poster generator — 1080x1080, cream + lavender, "I onboarded into AI Global"
// =====================================================================
function makePosterPanel(opts) {
  const wrap = document.createElement('div');
  wrap.className = 'panel';
  wrap.id = opts.panelId;
  wrap.dataset.poster = '1';
  wrap.dataset.posterOpts = JSON.stringify({
    name: opts.name, meters: opts.meters, won: opts.won,
    mainText: opts.mainText, lovedText: opts.lovedText,
    shareLine: opts.shareLine, disclosure: opts.disclosure,
  });
  wrap.innerHTML = `
    <h3>Your share card</h3>
    <p class="hint">Tasteful enough for LinkedIn. Download or share directly.</p>
    <div class="poster-wrap"></div>
  `;
  const cvs = drawPoster(opts);
  wrap.querySelector('.poster-wrap').appendChild(cvs);

  const row1 = document.createElement('div');
  row1.className = 'cta-row';
  row1.innerHTML = `
    <button class="cta secondary" data-act="copy1">${opts.copyLabel}</button>
    ${opts.copyLabel2 ? `<button class="cta secondary" data-act="copy2">${opts.copyLabel2}</button>` : ''}
  `;
  wrap.appendChild(row1);

  const row2 = document.createElement('div');
  row2.className = 'cta-row';
  row2.innerHTML = `
    <button class="cta secondary" data-act="dl">Download poster</button>
    ${opts.discordUrl ? `<a class="cta" href="${opts.discordUrl}" target="_blank" rel="noopener" style="text-decoration:none;text-align:center;">${opts.discordLabel}</a>` : ''}
    ${opts.discordUrl2 ? `<a class="cta secondary" href="${opts.discordUrl2}" target="_blank" rel="noopener" style="text-decoration:none;text-align:center;">${opts.discordLabel2}</a>` : ''}
  `;
  wrap.appendChild(row2);

  row1.querySelector('[data-act="copy1"]').addEventListener('click', e => copy(opts.copyText, e.currentTarget));
  if (opts.copyLabel2) row1.querySelector('[data-act="copy2"]').addEventListener('click', e => copy(opts.copyText2, e.currentTarget));
  row2.querySelector('[data-act="dl"]').addEventListener('click', () => downloadCanvas(cvs, `aiglo-${(opts.name || 'climber').toLowerCase()}.png`));
  return wrap;
}

function refreshPosters() {
  document.querySelectorAll('[data-poster]').forEach(p => {
    const o = JSON.parse(p.dataset.posterOpts || '{}');
    if (p.id === 'poster2') o.lovedText = state.stage2.loved;
    if (p.id === 'poster3') o.lovedText = state.stage3.loved;
    p.dataset.posterOpts = JSON.stringify(o);
    const newC = drawPoster(o);
    const wrap = p.querySelector('.poster-wrap');
    wrap.innerHTML = ''; wrap.appendChild(newC);
  });
}

function drawPoster({ name, meters, won, mainText, lovedText, shareLine, disclosure }) {
  const SZ = 1080;
  const cvs = document.createElement('canvas');
  cvs.width = SZ; cvs.height = SZ;
  cvs.style.width = '320px';
  const ctx = cvs.getContext('2d');
  const PAD = 80;
  ctx.textBaseline = 'alphabetic';

  // --- Deep violet ticket -------------------------------------------
  ctx.fillStyle = '#2a1454';
  ctx.fillRect(0, 0, SZ, SZ);

  // Pink moon-stamp in the top-right corner. Drawn as a big circle anchored
  // partway off-canvas so we see roughly a quarter — the corner accent from
  // the admit-one ticket reference.
  ctx.fillStyle = '#ff60a0';
  ctx.beginPath();
  ctx.arc(SZ - 30, 30, 320, 0, Math.PI * 2);
  ctx.fill();

  // Top mono kicker (left)
  ctx.fillStyle = '#d4baff';
  ctx.font = '700 16px "SF Mono", "JetBrains Mono", Menlo, monospace';
  ctx.fillText('AIGLO / 01', PAD, PAD + 14);

  // "ADMIT ONE" on the pink stamp (right). Drawn in deep violet so it reads
  // against the pink moon.
  ctx.fillStyle = '#2a1454';
  ctx.font = '900 16px "SF Mono", monospace';
  ctx.textAlign = 'right';
  ctx.fillText('ADMIT ONE', SZ - PAD, PAD + 14);
  ctx.textAlign = 'start';

  // --- Headline -----------------------------------------------------
  // "Climbed / {meters}m. / into AI Global." — meters in italic pink
  const HEAD_SIZE = 124;
  const headY = PAD + 230;
  ctx.fillStyle = '#faf6ff';
  ctx.font = `900 ${HEAD_SIZE}px Inter, -apple-system, "Helvetica Neue", sans-serif`;
  ctx.fillText('Climbed', PAD, headY);
  ctx.fillStyle = '#ffb0d8';
  ctx.font = `italic 900 ${HEAD_SIZE}px Georgia, "Times New Roman", serif`;
  ctx.fillText(`${meters || 0}m.`, PAD, headY + HEAD_SIZE);
  ctx.fillStyle = '#faf6ff';
  ctx.font = `900 ${HEAD_SIZE}px Inter, -apple-system, "Helvetica Neue", sans-serif`;
  ctx.fillText('into AI Global.', PAD, headY + HEAD_SIZE * 2);

  // --- Holder block --------------------------------------------------
  let yb = headY + HEAD_SIZE * 2 + 80;
  ctx.fillStyle = '#d4baff';
  ctx.font = '700 13px "SF Mono", Menlo, monospace';
  ctx.fillText('HOLDER', PAD, yb);
  yb += 30;
  ctx.fillStyle = '#faf6ff';
  ctx.font = '900 34px Inter, sans-serif';
  const tag = won ? '· SUMMIT' : '· PROGRESS';
  ctx.fillText(`${name || 'climber'}  ${tag}`, PAD, yb);
  yb += 24;
  ctx.fillStyle = 'rgba(212, 186, 255, 0.65)';
  ctx.font = '500 14px Inter, sans-serif';
  ctx.fillText('AI-assisted · human-edited', PAD, yb);

  // --- What stood out (optional) ------------------------------------
  if (lovedText && lovedText.trim()) {
    yb += 56;
    ctx.fillStyle = '#d4baff';
    ctx.font = '700 13px "SF Mono", Menlo, monospace';
    ctx.fillText('WHAT STOOD OUT', PAD, yb);
    yb += 30;
    ctx.fillStyle = '#faf6ff';
    ctx.font = 'italic 24px Georgia, "Times New Roman", serif';
    wrapText(ctx, '"' + lovedText.trim() + '"', PAD, yb, SZ - PAD * 2 - 140, 32, 3);
  }

  // --- Bottom band: thin rule + quarter/domain + barcode -----------
  const bandY = SZ - PAD - 38;
  ctx.fillStyle = 'rgba(212, 186, 255, 0.22)';
  ctx.fillRect(PAD, bandY - 18, SZ - PAD * 2, 1);

  ctx.fillStyle = '#d4baff';
  ctx.font = '700 12px "SF Mono", Menlo, monospace';
  ctx.fillText('Q1 · 2026  ·  MARKETING  ·  aiglo.org', PAD, bandY);

  // Barcode in the bottom-right corner — short vertical strokes, varied
  // widths, decorative only.
  ctx.fillStyle = '#faf6ff';
  const bars = [3, 1, 2, 1, 4, 1, 2, 3, 1, 2, 1, 3, 1, 2, 1, 4, 2, 1, 3];
  let bx = SZ - PAD - 130;
  const barTop = bandY - 18, barH = 20;
  for (let i = 0; i < bars.length; i++) {
    if (i % 2 === 0) ctx.fillRect(bx, barTop, bars[i], barH);
    bx += bars[i] + 1;
  }

  return cvs;
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const words = text.split(/\s+/);
  let line = '', yy = y, lines = 0;
  for (let i = 0; i < words.length; i++) {
    const test = line ? (line + ' ' + words[i]) : words[i];
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, yy); yy += lineHeight; lines++; line = words[i];
      if (lines >= maxLines - 1) { ctx.fillText(line + (words[i+1] ? '…' : ''), x, yy); return yy; }
    } else { line = test; }
  }
  if (line) { ctx.fillText(line, x, yy); }
  return yy;
}

// =====================================================================
// Helpers
// =====================================================================
function copy(s, btn) {
  navigator.clipboard.writeText(s).then(() => {
    if (btn) { const old = btn.textContent; btn.textContent = 'COPIED ✓'; setTimeout(() => btn.textContent = old, 1400); }
  }).catch(() => {});
}
function downloadCanvas(cvs, filename) {
  cvs.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
}
function escapeAttr(s) { return String(s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escapeText(s) { return String(s || '').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// =====================================================================
// Boot
// =====================================================================
async function boot() {
  loadState();
  await loadContent();
  // Snapshot which rock the character is on BEFORE we consume this run,
  // so we can animate the hop to the new rock once attempted state updates.
  const beforeAttempted = JSON.parse(JSON.stringify(state.attempted));
  const beforeIdx = (() => { for (let i = 1; i <= 5; i++) if (!beforeAttempted[i]) return i; return 5; })();

  // Pick up a finished climb run on return.
  let returningFrom = null;
  if (state.lastRun && !state.lastRun._consumed) {
    if (state.lastRun.mode === 'guided')                                          { state.attempted[1] = true; returningFrom = 1; }
    if (state.lastRun.mode === 'target' && state.lastRun.target === 150)         { state.attempted[2] = true; returningFrom = 2; }
    if (state.lastRun.mode === 'endless')                                         { state.attempted[3] = true; returningFrom = 3; }
    state.lastRun._consumed = true;
    saveState();
    try {
      const r = JSON.parse(localStorage.getItem(RUN_KEY) || '{}');
      r._consumed = true; localStorage.setItem(RUN_KEY, JSON.stringify(r));
    } catch (e) {}
  }
  // Footer is HTML (so the heart, team and smiley spans can be animated).
  if (CONTENT.menu && CONTENT.menu.footer) {
    document.getElementById('footer').innerHTML = CONTENT.menu.footer;
  }
  renderHello();
  renderScene();
  // Place character. If the next-rock index moved forward (just returned
  // from a winning climb), snap to the old rock first then leap to the new.
  const afterIdx = characterNextRock();
  if (afterIdx > beforeIdx) {
    snapCharacterTo(beforeIdx);
    setTimeout(() => leapTo(afterIdx), 350);
  } else {
    placeCharacter();
  }
  // Stage 1: NO modal on return. Just a celebratory toast at the top
  // of the menu, then the player picks Stage 2 themselves (or we auto-
  // open it). Stage 2 / 3 DO reopen because they have a deliverable
  // (poster, intro text) the player needs to see.
  if (returningFrom === 1) {
    const won = !!state.lastRun.won;
    const toastKey = won ? 'stage1Win' : 'stage1Fail';
    const toastTxt = (CONTENT.toasts && CONTENT.toasts[toastKey]) || (won ? '100 m.' : 'Off the wall.');
    setTimeout(() => showToast(toastTxt), 200);
    // Then open Stage 2 so they can keep going without another click.
    setTimeout(() => openStage(2), 1400);
  } else if (returningFrom === 2) {
    const won = !!state.lastRun.won;
    const toastKey = won ? 'stage2Win' : 'stage2Fail';
    const toastTxt = (CONTENT.toasts && CONTENT.toasts[toastKey]) || (won ? '150 m.' : 'Caught the wall.');
    setTimeout(() => showToast(toastTxt), 200);
    setTimeout(() => openStage(2), 1100);
  } else if (returningFrom === 3) {
    const meters = (state.lastRun && state.lastRun.meters) || 0;
    const tpl = (CONTENT.toasts && CONTENT.toasts.stage3) || { title: `Reached ${meters} m` };
    // Interpolate {meters} into either string or object form.
    const filled = typeof tpl === 'string'
      ? tpl.replace('{meters}', meters)
      : { ...tpl,
          title: (tpl.title || '').replace('{meters}', meters),
          sub:   (tpl.sub   || '').replace('{meters}', meters) };
    setTimeout(() => showToast(filled), 200);
    setTimeout(() => openStage(3), 1100);
  }
  document.getElementById('scrim').addEventListener('click', e => {
    if (e.target.id === 'scrim') closeStage();
  });
}
boot();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Global · Onboarding</title>
<style>
  /* === Palette (matches climb.html) ===================================== */
  :root {
    --cream:        #faf6ff;
    --cream-2:      #f0e6ff;
    --lavender:     #b890ff;
    --lavender-2:   #d4baff;
    --lavender-3:   #e8defa;
    --pink:         #ff60a0;
    --pink-2:       #ffb0d8;
    --violet:       #4a2a7a;
    --violet-2:     #6a4ec0;
    --violet-deep:  #2a1454;
    --teal:         #3aa890;
    --shadow:       rgba(60, 30, 120, 0.18);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: var(--cream); color: var(--violet-deep); font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif; line-height: 1.55; }
  a { color: var(--violet-2); }

  /* === Page chrome ====================================================== */
  .page { max-width: 720px; margin: 0 auto; padding: 32px 22px 80px; }
  @media (min-width: 900px) { .page { max-width: 960px; padding: 56px 32px 120px; } }

  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom: 28px; }
  .brand   { font-weight: 900; letter-spacing: 3px; font-size: 14px; color: var(--violet); }
  .brand span { color: var(--pink); }
  .kicker  { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.55; }

  /* === Hello header ===================================================== */
  .hello { margin-bottom: 28px; }
  .hello h1 { font-size: clamp(34px, 7vw, 52px); line-height: 1.05; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px; }
  .hello h1 .accent { color: var(--lavender); }
  .hello p { font-size: 17px; opacity: 0.78; max-width: 52ch; }

  /* === Tile grid ======================================================== */
  .tiles { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .tiles { grid-template-columns: 1fr 1fr; } }
  .tile { background: white; border-radius: 18px; padding: 22px; box-shadow: 0 6px 20px var(--shadow); border: 1px solid var(--lavender-3); position: relative; transition: transform 0.12s ease, box-shadow 0.12s ease; cursor: pointer; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 10px 28px var(--shadow); }
  .tile .step { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--lavender); font-weight: 800; }
  .tile h2 { font-size: 22px; font-weight: 900; margin-top: 4px; margin-bottom: 6px; letter-spacing: -0.2px; }
  .tile p  { font-size: 14px; opacity: 0.75; }
  .tile .badge { position: absolute; top: 18px; right: 18px; font-size: 10px; font-weight: 800; letter-spacing: 2px; padding: 4px 9px; border-radius: 999px; }
  .tile .badge.done  { background: var(--teal); color: white; }
  .tile .badge.next  { background: var(--pink); color: white; }

  /* === Stage screens (modal-style overlays) ============================= */
  .scrim { position: fixed; inset: 0; background: rgba(40, 20, 70, 0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; align-items: flex-start; justify-content: center; z-index: 50; padding: 24px 16px; overflow-y: auto; }
  .scrim.on { display: flex; }
  .sheet { background: var(--cream); border-radius: 22px; padding: 28px 24px 32px; max-width: 560px; width: 100%; box-shadow: 0 30px 80px rgba(40, 20, 70, 0.35); margin: 8px 0 32px; }
  @media (min-width: 720px) { .sheet { padding: 36px 36px 40px; } }
  .sheet .topline { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .sheet .step { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--lavender); font-weight: 800; }
  .sheet .close-x { background: none; border: none; color: var(--violet); font-size: 26px; cursor: pointer; line-height: 1; padding: 4px 8px; opacity: 0.5; }
  .sheet .close-x:hover { opacity: 1; }
  .sheet h2 { font-size: 28px; font-weight: 900; letter-spacing: -0.2px; margin-bottom: 4px; }
  .sheet .subtitle { font-size: 14px; opacity: 0.7; margin-bottom: 22px; }
  .sheet .panel { background: white; border: 1px solid var(--lavender-3); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .sheet .panel.tinted { background: var(--lavender-3); border-color: var(--lavender-2); }
  .sheet .panel h3 { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--violet-2); margin-bottom: 8px; font-weight: 800; }
  .sheet .panel p { font-size: 15px; opacity: 0.85; }
  .sheet .panel p + p { margin-top: 8px; }
  .sheet label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--violet); margin-bottom: 6px; margin-top: 14px; }
  .sheet input, .sheet textarea { width: 100%; background: white; border: 1.5px solid var(--lavender-3); border-radius: 10px; padding: 11px 13px; font-size: 16px; color: var(--violet-deep); font-family: inherit; }
  .sheet input:focus, .sheet textarea:focus { outline: none; border-color: var(--lavender); }
  .sheet textarea { min-height: 70px; resize: vertical; line-height: 1.45; }
  .sheet .hint { font-size: 12px; opacity: 0.55; margin-top: 4px; }
  .sheet .examples { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .sheet .examples button { background: var(--lavender-3); color: var(--violet); border: none; border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .sheet .examples button:hover { background: var(--lavender-2); }

  .cta { width: 100%; background: var(--lavender); color: var(--violet-deep); border: none; border-radius: 12px; padding: 14px 22px; font-size: 16px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; box-shadow: 0 6px 0 var(--violet-2), 0 10px 22px rgba(80, 40, 140, 0.28); margin-top: 18px; transition: transform 0.08s; font-family: inherit; }
  .cta:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--violet-2); }
  .cta.secondary { background: white; color: var(--violet); box-shadow: 0 4px 0 var(--lavender-3); font-size: 13px; padding: 11px 16px; }
  .cta.secondary:active { box-shadow: 0 2px 0 var(--lavender-3); }
  .cta.ghost { background: transparent; color: var(--violet); box-shadow: none; border: 2px solid var(--lavender); }
  .cta.tiny { font-size: 12px; padding: 7px 14px; margin-top: 0; box-shadow: 0 3px 0 var(--lavender-3); }
  .cta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .cta-row .cta { flex: 1 1 200px; margin-top: 0; }
  .cta-row .cta.secondary { flex: 1 1 140px; }

  /* Category picker grid */
  .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  @media (min-width: 480px) { .cat-grid { grid-template-columns: repeat(4, 1fr); } }
  .cat-grid button { background: white; border: 1.5px solid var(--lavender-3); border-radius: 12px; padding: 12px 8px; font-size: 13px; font-weight: 800; color: var(--violet); cursor: pointer; font-family: inherit; transition: transform 0.06s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cat-grid button .emoji { font-size: 22px; }
  .cat-grid button:hover { border-color: var(--lavender); }
  .cat-grid button.selected { background: var(--lavender); color: var(--violet-deep); border-color: var(--lavender); transform: scale(0.96); }

  /* Intro-line display */
  .intro-line { background: white; border: 1.5px solid var(--lavender); border-radius: 14px; padding: 16px 18px; margin-top: 14px; font-size: 15.5px; line-height: 1.5; color: var(--violet-deep); min-height: 80px; }
  .intro-line.empty { color: var(--violet-2); opacity: 0.55; font-style: italic; }
  .intro-line[contenteditable="true"] { outline: 2px solid var(--lavender); }

  /* Madlib form */
  .madlib { background: white; border: 1px solid var(--lavender-3); border-radius: 14px; padding: 4px; margin-top: 12px; }
  .madlib-row { border-bottom: 1px dashed var(--lavender-3); padding: 12px 14px; }
  .madlib-row:last-child { border-bottom: none; }
  .madlib-row label { margin-top: 0; margin-bottom: 4px; font-size: 11px; }
  .madlib-row input { border: none; padding: 4px 0; font-size: 15px; background: transparent; border-bottom: 1.5px solid transparent; border-radius: 0; }
  .madlib-row input:focus { border-bottom-color: var(--lavender); }

  /* Result poster */
  .poster-wrap { display: flex; justify-content: center; margin: 16px 0 8px; }
  .poster-wrap canvas { max-width: 100%; height: auto; border-radius: 14px; box-shadow: 0 12px 32px var(--shadow); display: block; }

  /* Stage 4 link tile */
  .external-tile { background: linear-gradient(135deg, var(--lavender-2), var(--pink-2)); border-radius: 16px; padding: 22px; color: var(--violet-deep); text-decoration: none; display: block; }
  .external-tile h3 { font-size: 22px; margin-bottom: 6px; font-weight: 900; }
  .external-tile p { font-size: 14px; opacity: 0.85; }
  .external-tile .arrow { float: right; font-size: 24px; opacity: 0.6; }

  /* Footer */
  .footer { margin-top: 56px; font-size: 12px; opacity: 0.5; text-align: center; letter-spacing: 1px; }

  /* Tiny utility */
  .hidden { display: none !important; }
</style>
</head>
<body>

<main class="page" id="app">

  <div class="topbar">
    <div class="brand">AI <span>GLOBAL</span></div>
    <div class="kicker">Onboarding</div>
  </div>

  <section class="hello">
    <h1>Welcome<span id="welcomeComma"></span> <span id="welcomeName" class="accent">in</span>.</h1>
    <p id="welcomeBlurb">Five short stages. Each ends with a tiny climbing game. You'll learn what AI Global is, draft your first intro, and leave with a poster you can share.</p>
  </section>

  <ol class="tiles" id="tilesGrid"></ol>

  <p class="footer" id="footer">aiglo.org · MIT Professional Education-backed</p>
</main>

<div class="scrim" id="scrim">
  <div class="sheet" id="sheet"></div>
</div>

<script>
// =====================================================================
// State + content loader
// =====================================================================
const STATE_KEY = 'aiglo.state';
const NAME_KEY  = 'aiglo.name';
const RUN_KEY   = 'aiglo.lastRun';

let CONTENT = null, INTROS = null, MADLIB = null;

const state = {
  name: '',
  attempted: { 1: false, 2: false, 3: false, 4: false, 5: false },
  stage2: { category: null, intro: '', custom: '', loved: '' },
  stage3: { fields: {}, loved: '' },
  lastRun: null,
};

function loadState() {
  try { const r = localStorage.getItem(STATE_KEY); if (r) Object.assign(state, JSON.parse(r)); } catch (e) {}
  try { const n = localStorage.getItem(NAME_KEY);  if (n) state.name = n; } catch (e) {}
  try { const r = localStorage.getItem(RUN_KEY);   if (r) state.lastRun = JSON.parse(r); } catch (e) {}
}
function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify({
    name: state.name, attempted: state.attempted, stage2: state.stage2, stage3: state.stage3,
  })); } catch (e) {}
  if (state.name) { try { localStorage.setItem(NAME_KEY, state.name); } catch (e) {} }
}

async function loadContent() {
  const [s, i, m] = await Promise.all([
    fetch('content/stage-text.json').then(r => r.json()),
    fetch('content/intros.json').then(r => r.json()),
    fetch('content/madlib-examples.json').then(r => r.json()),
  ]);
  CONTENT = s; INTROS = i; MADLIB = m;
}

// =====================================================================
// Tile renderer
// =====================================================================
function renderHello() {
  const nameEl = document.getElementById('welcomeName');
  const commaEl = document.getElementById('welcomeComma');
  if (state.name) { nameEl.textContent = state.name; commaEl.textContent = ','; }
  else            { nameEl.textContent = 'in';      commaEl.textContent = ''; }
}

function renderTiles() {
  const g = document.getElementById('tilesGrid');
  const t = CONTENT;
  // ALL stages open. Done badge if attempted; Next badge on first unattempted.
  const stages = [1,2,3,4,5].map(id => ({
    id, title: t['stage'+id].title, sub: t['stage'+id].subtitle
  }));
  const nextIdx = stages.findIndex(s => !state.attempted[s.id]);
  g.innerHTML = '';
  for (const s of stages) {
    const done = !!state.attempted[s.id];
    const next = (s.id === stages[nextIdx]?.id);
    const li = document.createElement('li');
    li.className = 'tile';
    li.innerHTML = `
      <span class="step">Stage ${s.id}</span>
      <h2>${s.title}</h2>
      <p>${s.sub}</p>
      ${done ? '<span class="badge done">DONE</span>' : (next ? '<span class="badge next">NEXT</span>' : '')}
    `;
    li.addEventListener('click', () => openStage(s.id));
    g.appendChild(li);
  }
}

// =====================================================================
// Stage routing
// =====================================================================
function openStage(n) {
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = '';
  sheet.appendChild(makeStageHeader(n));
  if (n === 1) renderStage1(sheet);
  if (n === 2) renderStage2(sheet);
  if (n === 3) renderStage3(sheet);
  if (n === 4) renderStage4(sheet);
  if (n === 5) renderStage5(sheet);
  document.getElementById('scrim').classList.add('on');
  sheet.scrollTop = 0;
  document.querySelector('.scrim').scrollTop = 0;
}
function closeStage() { document.getElementById('scrim').classList.remove('on'); }
function makeStageHeader(n) {
  const t = CONTENT['stage' + n];
  const d = document.createElement('div');
  d.innerHTML = `
    <div class="topline">
      <span class="step">Stage ${n}</span>
      <button class="close-x" type="button" aria-label="Close">×</button>
    </div>
    <h2>${t.title}</h2>
    <p class="subtitle">${t.subtitle}</p>
  `;
  d.querySelector('.close-x').addEventListener('click', closeStage);
  return d;
}

// =====================================================================
// Stage 1 — Welcome + minimal pre-info + 100m climb + richer post-info
// =====================================================================
function renderStage1(sheet) {
  const t = CONTENT.stage1;

  // Name capture
  const name = document.createElement('div');
  name.className = 'panel';
  name.innerHTML = `
    <h3>${t.nameLabel}</h3>
    <input id="nameInput" type="text" placeholder="${t.namePlaceholder}" value="${escapeAttr(state.name)}" maxlength="40" autocomplete="given-name">
    <p class="hint">${t.namePersist}</p>
  `;
  sheet.appendChild(name);
  const input = name.querySelector('#nameInput');
  input.addEventListener('input', () => { state.name = input.value.trim(); saveState(); renderHello(); });

  // Minimal pre-climb panel
  const pre = document.createElement('div');
  pre.className = 'panel';
  pre.innerHTML = `<h3>${t.pre.title}</h3><p>${t.pre.body}</p>`;
  sheet.appendChild(pre);

  // Outcome panel (only after a guided run)
  if (state.lastRun && state.lastRun.mode === 'guided' && !state.lastRun._consumedAt1) {
    const o = t.outcome;
    const won = !!state.lastRun.won;
    const out = document.createElement('div');
    out.className = 'panel tinted';
    out.innerHTML = `
      <h3>${won ? o.winTitle : o.failTitle}</h3>
      <p>${won ? o.winBody : o.failBody}</p>
      <p><strong>${o.next}</strong></p>
    `;
    sheet.appendChild(out);
  }

  const cta = document.createElement('button');
  cta.className = 'cta';
  cta.textContent = t.ctaLabel;
  cta.addEventListener('click', () => {
    if (!state.name) { input.focus(); return; }
    saveState();
    launchClimb({ guided: true, target: 100 });
  });
  sheet.appendChild(cta);
  const hint = document.createElement('p'); hint.className = 'hint'; hint.style.textAlign = 'center'; hint.textContent = t.ctaHint;
  sheet.appendChild(hint);
}

// =====================================================================
// Stage 2 — Discord brief + intro picker + 150m + poster
// =====================================================================
function renderStage2(sheet) {
  const t = CONTENT.stage2;

  // Pre-climb context
  const pre = document.createElement('div');
  pre.className = 'panel';
  pre.innerHTML = `<h3>${t.pre.title}</h3><p>${t.pre.body}</p>`;
  sheet.appendChild(pre);

  // Category picker
  const picker = document.createElement('div');
  picker.className = 'panel';
  picker.innerHTML = `<h3>${t.categoryPrompt}</h3><div class="cat-grid" id="catGrid"></div>`;
  sheet.appendChild(picker);
  const grid = picker.querySelector('#catGrid');
  for (const c of CONTENT.categories) {
    const b = document.createElement('button');
    b.innerHTML = `<span class="emoji">${c.emoji}</span><span>${c.label}</span>`;
    b.dataset.cat = c.id;
    if (state.stage2.category === c.id) b.classList.add('selected');
    b.addEventListener('click', () => {
      grid.querySelectorAll('button').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      state.stage2.category = c.id;
      state.stage2.intro = pickIntro(state.name, c.id, 0);
      state.stage2.custom = '';
      shuffleCount = 0;
      lineBox.contentEditable = 'false';
      lineBox.textContent = renderIntroLine(state.stage2.intro);
      lineBox.classList.remove('empty');
      saveState();
    });
    grid.appendChild(b);
  }

  // Intro line
  const lineBox = document.createElement('div');
  const currentLine = state.stage2.custom || (state.stage2.intro ? renderIntroLine(state.stage2.intro) : '');
  lineBox.className = 'intro-line ' + (currentLine ? '' : 'empty');
  lineBox.textContent = currentLine || 'Pick a lane above to see a draft.';
  sheet.appendChild(lineBox);

  let shuffleCount = 0;
  const btnRow = document.createElement('div');
  btnRow.className = 'cta-row';
  btnRow.innerHTML = `
    <button class="cta secondary" id="shuffleBtn">${t.shuffleLabel}</button>
    <button class="cta secondary" id="ownBtn">${t.ownLabel}</button>
  `;
  sheet.appendChild(btnRow);
  btnRow.querySelector('#shuffleBtn').addEventListener('click', () => {
    if (!state.stage2.category) return;
    shuffleCount++;
    state.stage2.intro = pickIntro(state.name, state.stage2.category, shuffleCount);
    state.stage2.custom = '';
    lineBox.contentEditable = 'false';
    lineBox.textContent = renderIntroLine(state.stage2.intro);
    lineBox.classList.remove('empty');
    saveState();
  });
  btnRow.querySelector('#ownBtn').addEventListener('click', () => {
    state.stage2.intro = '';
    state.stage2.custom = state.stage2.custom || t.ownPlaceholder.replace('{name}', state.name || '');
    lineBox.contentEditable = 'true';
    lineBox.textContent = state.stage2.custom;
    lineBox.classList.remove('empty');
    lineBox.focus();
  });
  lineBox.addEventListener('input', () => {
    if (lineBox.contentEditable === 'true') { state.stage2.custom = lineBox.textContent; saveState(); }
  });

  // Outcome — only after a 150m run
  if (state.lastRun && state.lastRun.mode === 'target' && state.lastRun.target === 150 && !state.lastRun._consumedAt2) {
    const finalLine = state.stage2.custom || renderIntroLine(state.stage2.intro) || '';
    sheet.appendChild(makeOutcomePanel({
      tinted: true,
      won: state.lastRun.won,
      titleWin: t.outcome.winTitle,
      bodyWin:  t.outcome.winBody,
      titleFail: t.outcome.failTitle.replace('{meters}', state.lastRun.meters),
      bodyFail:  t.outcome.failBody,
      nextLine: t.outcome.next,
    }));
    sheet.appendChild(makeLovedField({
      stageKey: 'stage2',
      prompt: t.outcome.lovedPrompt,
      placeholder: t.outcome.lovedPlaceholder,
      initial: state.stage2.loved || '',
      onChange: v => { state.stage2.loved = v; saveState(); refreshPosters(); },
    }));
    sheet.appendChild(makePosterPanel({
      panelId: 'poster2',
      name: state.name,
      meters: state.lastRun.meters,
      won: state.lastRun.won,
      mainText: finalLine,
      lovedText: state.stage2.loved,
      copyLabel: 'Copy intro',
      copyText: finalLine,
      discordLabel: 'Open #introduce-yourself',
      discordUrl: CONTENT.brand.deepLinks.introduceYourself,
    }));
  }

  const cta = document.createElement('button');
  cta.className = 'cta';
  cta.textContent = t.ctaLabel;
  cta.addEventListener('click', () => {
    if (!state.stage2.category && !state.stage2.custom) {
      lineBox.classList.add('empty');
      lineBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    launchClimb({ target: 150 });
  });
  sheet.appendChild(cta);
  const hint = document.createElement('p'); hint.className = 'hint'; hint.style.textAlign = 'center'; hint.textContent = t.ctaHint;
  sheet.appendChild(hint);
}

// =====================================================================
// Stage 3 — Buddy madlib + fuller info + endless climb + poster
// =====================================================================
function renderStage3(sheet) {
  const t = CONTENT.stage3;

  // How buddies work
  const pre = document.createElement('div');
  pre.className = 'panel';
  pre.innerHTML = `<h3>${t.pre.title}</h3><p>${t.pre.body}</p>`;
  sheet.appendChild(pre);

  // Full picture of the community
  const full = document.createElement('div');
  full.className = 'panel';
  full.innerHTML = `<h3>${t.fullPicture.title}</h3><p>${t.fullPicture.body}</p>`;
  sheet.appendChild(full);

  // Madlib form
  state.stage3.fields = state.stage3.fields || {};
  const form = document.createElement('div');
  form.className = 'madlib';
  for (const f of MADLIB.fields) {
    const row = document.createElement('div');
    row.className = 'madlib-row';
    const init = state.stage3.fields[f.key] || (f.key === 'displayName' ? state.name : '');
    row.innerHTML = `
      <label>${f.emoji} ${f.label}</label>
      <input data-key="${f.key}" placeholder="${escapeAttr(f.placeholder)}" value="${escapeAttr(init)}">
      <div class="examples">
        ${f.examples.map(ex => `<button type="button" data-ex="${escapeAttr(ex)}">${escapeText(ex)}</button>`).join('')}
      </div>
    `;
    form.appendChild(row);
    const inp = row.querySelector('input');
    inp.addEventListener('input', () => { state.stage3.fields[f.key] = inp.value; saveState(); });
    row.querySelectorAll('.examples button').forEach(b => {
      b.addEventListener('click', () => {
        inp.value = b.dataset.ex; state.stage3.fields[f.key] = inp.value; saveState();
      });
    });
  }
  sheet.appendChild(form);

  // Outcome (after endless run)
  if (state.lastRun && state.lastRun.mode === 'endless' && !state.lastRun._consumedAt3) {
    const buddyMsg = composeBuddyMessage();
    sheet.appendChild(makeOutcomePanel({
      tinted: true,
      won: false,
      titleFail: t.outcome.posterTitle.replace('{meters}', state.lastRun.meters),
      bodyFail:  t.outcome.posterBody,
      nextLine:  t.outcome.next,
    }));
    sheet.appendChild(makeLovedField({
      stageKey: 'stage3',
      prompt: t.outcome.lovedPrompt,
      placeholder: t.outcome.lovedPlaceholder,
      initial: state.stage3.loved || '',
      onChange: v => { state.stage3.loved = v; saveState(); refreshPosters(); },
    }));
    sheet.appendChild(makePosterPanel({
      panelId: 'poster3',
      name: state.name,
      meters: state.lastRun.meters,
      won: false,
      mainText: buddyMsg,
      lovedText: state.stage3.loved,
      copyLabel: 'Copy for #find-a-buddy',
      copyText:  buddyMsg,
      copyLabel2: 'Copy intro line',
      copyText2: state.stage2.custom || renderIntroLine(state.stage2.intro) || `Hi everyone, I'm ${state.name || 'there'}.`,
      discordLabel: 'Open #find-a-buddy',
      discordUrl: CONTENT.brand.deepLinks.findABuddy,
      discordLabel2: 'Open #introduce-yourself',
      discordUrl2: CONTENT.brand.deepLinks.introduceYourself,
    }));
  }

  const cta = document.createElement('button');
  cta.className = 'cta';
  cta.textContent = t.ctaLabel;
  cta.addEventListener('click', () => launchClimb({ endless: true }));
  sheet.appendChild(cta);
  const hint = document.createElement('p'); hint.className = 'hint'; hint.style.textAlign = 'center'; hint.textContent = t.ctaHint;
  sheet.appendChild(hint);
}

function composeBuddyMessage() {
  const m = MADLIB;
  let out = m.header + '\n';
  for (const f of m.fields) {
    const v = (state.stage3.fields[f.key] || '').trim();
    if (!v) continue;
    out += `${f.emoji} ${f.label}: ${v}\n`;
  }
  return out.trim();
}

function makeLovedField({ stageKey, prompt, placeholder, initial, onChange }) {

  ta.addEventListener('input', () => onChange(ta.value.trim()));

// =====================================================================
// Intro picker
// =====================================================================
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function dayOfYear() {
  const d = new Date(); const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}
function pickIntro(name, category, shuffleSeed) {
  const pool = (INTROS[category] || []); if (!pool.length) return '';
  const idx = hashStr(`${name}|${category}|${dayOfYear()}|${shuffleSeed}`) % pool.length;
  return pool[idx];
}
function renderIntroLine(line) { return line ? line.replace(/<NAME>/g, state.name || 'there') : ''; }

// =====================================================================
// Climb game hand-off
// =====================================================================
function launchClimb(opts) {
  const p = new URLSearchParams();
  if (opts.guided)  p.set('guided', '1');
  if (opts.target)  p.set('target', String(opts.target));
  if (opts.endless) p.set('endless', '1');
  if (opts.seed)    p.set('seed', String(opts.seed));
  const here = location.pathname.replace(/index\.html$/, '');
  p.set('return', here || './');
  location.href = 'climb.html?' + p.toString();
}

// =====================================================================
// Poster generator — 1080x1080, cream + lavender, "I onboarded into AI Global"
// =====================================================================
function makePosterPanel(opts) {
  const wrap = document.createElement('div');
  wrap.className = 'panel';
  wrap.id = opts.panelId;
  wrap.dataset.poster = '1';
  wrap.dataset.posterOpts = JSON.stringify({
    name: opts.name, meters: opts.meters, won: opts.won,
    mainText: opts.mainText, lovedText: opts.lovedText,
  });
  wrap.innerHTML = `
    <h3>Your share card</h3>
    <p class="hint">Tasteful enough for LinkedIn. Download or share directly.</p>
    <div class="poster-wrap"></div>
  `;
  const cvs = drawPoster(opts);
  wrap.querySelector('.poster-wrap').appendChild(cvs);

  const row1 = document.createElement('div');
  row1.className = 'cta-row';
  row1.innerHTML = `
    <button class="cta secondary" data-act="copy1">${opts.copyLabel}</button>
    ${opts.copyLabel2 ? `<button class="cta secondary" data-act="copy2">${opts.copyLabel2}</button>` : ''}
  `;
  wrap.appendChild(row1);

  const row2 = document.createElement('div');
  row2.className = 'cta-row';
  row2.innerHTML = `
    <button class="cta secondary" data-act="dl">Download poster</button>
    ${opts.discordUrl ? `<a class="cta" href="${opts.discordUrl}" target="_blank" rel="noopener" style="text-decoration:none;text-align:center;">${opts.discordLabel}</a>` : ''}
    ${opts.discordUrl2 ? `<a class="cta secondary" href="${opts.discordUrl2}" target="_blank" rel="noopener" style="text-decoration:none;text-align:center;">${opts.discordLabel2}</a>` : ''}
  `;
  wrap.appendChild(row2);

  row1.querySelector('[data-act="copy1"]').addEventListener('click', e => copy(opts.copyText, e.currentTarget));
  if (opts.copyLabel2) row1.querySelector('[data-act="copy2"]').addEventListener('click', e => copy(opts.copyText2, e.currentTarget));
  row2.querySelector('[data-act="dl"]').addEventListener('click', () => downloadCanvas(cvs, `aiglo-${(opts.name || 'climber').toLowerCase()}.png`));
  return wrap;
}

function refreshPosters() {
  document.querySelectorAll('[data-poster]').forEach(p => {
    const o = JSON.parse(p.dataset.posterOpts || '{}');
    if (p.id === 'poster2') o.lovedText = state.stage2.loved;
    if (p.id === 'poster3') o.lovedText = state.stage3.loved;
    p.dataset.posterOpts = JSON.stringify(o);
    const newC = drawPoster(o);
    const wrap = p.querySelector('.poster-wrap');
    wrap.innerHTML = ''; wrap.appendChild(newC);
  });
}

function drawPoster({ name, meters, won, mainText, lovedText }) {
  const SZ = 1080;
  const cvs = document.createElement('canvas');
  cvs.width = SZ; cvs.height = SZ;
  cvs.style.width = '320px';
  const ctx = cvs.getContext('2d');

  // Background
  const g = ctx.createLinearGradient(0, 0, 0, SZ);
  g.addColorStop(0, '#faf6ff');
  g.addColorStop(1, '#e0d4f5');
  ctx.fillStyle = g; ctx.fillRect(0, 0, SZ, SZ);

  const PAD = 80;

  // Header: AI GLOBAL + onboarding kicker
  ctx.fillStyle = '#4a2a7a';
  ctx.font = '900 38px Inter, -apple-system, sans-serif';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('AI GLOBAL', PAD, PAD + 30);
  ctx.fillStyle = '#ff60a0';
  ctx.fillRect(PAD, PAD + 50, 80, 5);
  ctx.fillStyle = '#6a4ec0';
  ctx.font = '600 14px Inter, sans-serif';
  ctx.fillText('ONBOARDING · MIT PROFESSIONAL EDUCATION-BACKED', PAD, PAD + 84);

  // Centerpiece: big metric. Compose "Nm" as one string so alignment works.
  const metricStr = String(meters) + 'm';
  ctx.fillStyle = '#4a2a7a';
  ctx.font = '900 220px Inter, sans-serif';
  ctx.textBaseline = 'alphabetic';
  const metricY = 380;
  ctx.fillText(metricStr, PAD, metricY);

  // Sub-label under the metric
  ctx.fillStyle = '#6a4ec0';
  ctx.font = '700 18px Inter, sans-serif';
  ctx.fillText(won ? 'SUMMIT REACHED' : 'HEIGHT REACHED', PAD, metricY + 36);

  // Name
  ctx.fillStyle = '#4a2a7a';
  ctx.font = '900 48px Inter, sans-serif';
  ctx.fillText(name || 'climber', PAD, metricY + 96);

  // "I just onboarded" line
  ctx.fillStyle = '#2a1454';
  ctx.font = '500 22px Inter, sans-serif';
  ctx.fillText('I just onboarded into AI Global @ MIT.', PAD, metricY + 138);

  // What stood out (loved)
  let yPtr = metricY + 196;
  if (lovedText && lovedText.trim()) {
    ctx.fillStyle = '#6a4ec0';
    ctx.font = '700 14px Inter, sans-serif';
    ctx.fillText('WHAT STOOD OUT', PAD, yPtr);
    yPtr += 30;
    ctx.fillStyle = '#2a1454';
    ctx.font = 'italic 24px Inter, sans-serif';
    yPtr = wrapText(ctx, '"' + lovedText.trim() + '"', PAD, yPtr, SZ - PAD * 2, 32, 4);
    yPtr += 14;
  }

  // Footer band: aiglo.org + tagline
  ctx.fillStyle = '#b890ff';
  ctx.fillRect(PAD, SZ - PAD - 56, SZ - PAD * 2, 3);
  ctx.fillStyle = '#4a2a7a';
  ctx.font = '700 18px Inter, sans-serif';
  ctx.fillText('aiglo.org', PAD, SZ - PAD - 18);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#6a4ec0';
  ctx.font = '500 14px Inter, sans-serif';
  ctx.fillText('One quarter · one domain · real AI systems.', SZ - PAD, SZ - PAD - 18);
  ctx.textAlign = 'start';

  return cvs;
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const words = text.split(/\s+/);
  let line = '', yy = y, lines = 0;
  for (let i = 0; i < words.length; i++) {
    const test = line ? (line + ' ' + words[i]) : words[i];
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, yy); yy += lineHeight; lines++; line = words[i];
      if (lines >= maxLines - 1) { ctx.fillText(line + (words[i+1] ? '…' : ''), x, yy); return yy; }
    } else { line = test; }
  }
  if (line) { ctx.fillText(line, x, yy); }
  return yy;
}

// =====================================================================
// Helpers
// =====================================================================
function copy(s, btn) {
  navigator.clipboard.writeText(s).then(() => {
    if (btn) { const old = btn.textContent; btn.textContent = 'COPIED ✓'; setTimeout(() => btn.textContent = old, 1400); }
  }).catch(() => {});
}
function downloadCanvas(cvs, filename) {
  cvs.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
}
function escapeAttr(s) { return String(s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escapeText(s) { return String(s || '').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// =====================================================================
// Boot
// =====================================================================
async function boot() {
  loadState();
  await loadContent();
  // Pick up a finished climb run on return
  if (state.lastRun && !state.lastRun._consumed) {
    if (state.lastRun.mode === 'guided') state.attempted[1] = true;
    if (state.lastRun.mode === 'target' && state.lastRun.target === 150) state.attempted[2] = true;
    if (state.lastRun.mode === 'endless') state.attempted[3] = true;
    state.lastRun._consumed = true;
    saveState();
    try {
      const r = JSON.parse(localStorage.getItem(RUN_KEY) || '{}');
      r._consumed = true; localStorage.setItem(RUN_KEY, JSON.stringify(r));
    } catch (e) {}
  }
  document.getElementById('footer').textContent = CONTENT.menu.footer;
  renderHello();
  renderTiles();
  // Auto-open the matching stage on return so the player lands on the outcome.
  if (state.lastRun && state.lastRun.mode) {
    const m = state.lastRun.mode;
    setTimeout(() => {
      if (m === 'guided') openStage(1);
      else if (m === 'target' && state.lastRun.target === 150) openStage(2);
      else if (m === 'endless') openStage(3);
    }, 250);
  }
  document.getElementById('scrim').addEventListener('click', e => {
    if (e.target.id === 'scrim') closeStage();
  });
}
boot();
